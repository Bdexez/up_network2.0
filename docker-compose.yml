services:
  db:
    image: postgres:16-alpine
    container_name: up_network_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: upnet
      POSTGRES_PASSWORD: upnet
      POSTGRES_DB: up_network
    ports:
      # 5433 côté hôte : évite le conflit avec un PostgreSQL déjà installé.
      - '5433:5432'
    volumes:
      - up_network_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U upnet -d up_network']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  up_network_pgdata:
